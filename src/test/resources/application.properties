spring.datasource.url=jdbc:h2:mem:reviewme;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=review-me-test-secret-key-at-least-thirty-two-bytes
app.jwt.access-token-seconds=3600
app.jwt.refresh-token-seconds=1209600
app.auth.refresh-cookie-secure=false
app.cors.allowed-origins=http://localhost:3000
