server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/reviewme;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chat-schema.sql
app.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
app.cors.allowed-origins=http://127.0.0.1:5173,http://localhost:5173
