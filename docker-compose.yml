services:
    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_NAME:-Index_DB}
            MYSQL_USER: ${DB_USERNAME:-Index_Team}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./src/main/resources/static/init_schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20

    app:
        build: .
        ports:
            - "8080:8080"
        environment:
            DB_ADDRESS: db
            DB_PORT: 3306
            DB_USERNAME: ${DB_USERNAME:-Index_Team}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME:-Index_DB}
        depends_on:
            db:
                condition: service_healthy

volumes:
    mysql_data:
